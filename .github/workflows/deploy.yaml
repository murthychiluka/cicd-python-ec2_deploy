
name: Build and Deploy Python App

on:
  push:
    branches:
      - main

jobs:

  # =========================
  # BUILD AND TEST
  # =========================
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          source venv/bin/activate
          pytest

      - name: Create deployment package
        run: |
          tar -czf python-app.tar.gz \
            app.py \
            requirements.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: python-app.tar.gz


  # =========================
  # DEPLOY
  # =========================
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key

          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy application to EC2
        run: |
          scp -i ~/.ssh/ec2_key \
            python-app.tar.gz \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/ec2_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

          sudo mkdir -p /opt/python-app

          sudo tar -xzf /tmp/python-app.tar.gz \
            -C /opt/python-app

          cd /opt/python-app

          python3 -m venv venv

          source venv/bin/activate

          pip install --upgrade pip
          pip install -r requirements.txt

          sudo systemctl restart python-app

          EOF

